<!DOCTYPE html>
<html>
  <head>
    <title>Sign Up</title>
    <style>
      .namebox,
      .lastname {
        color: rgb(100, 100, 100);
        width: 150px;
        border-radius: 8px;
        padding-top: 12px;
        font-size: 16px;
        padding-bottom: 12px;
        padding-left: 16px;
        padding-right: 16px;
        border-style: solid;
        border-color:rgb(211, 206, 206);
        margin-bottom: 12px;

      }
      
      .emailbox {
        color: rgb(100, 100, 100);
        width: 340px;
        border-radius: 6px;
        padding-top: 12px;
        font-size: 16px;
        padding-bottom: 12px;
        padding-left: 16px;
        padding-right: 16px;
        border-style: solid;
        border-color:rgb(211, 206, 206);
        display: block;
      }
      .signup-button {
        color: white;
        background-color: rgb(57, 131, 210);
        cursor: pointer;
        font-weight: bold;
        margin-top: 10px;
        border: none;
        font-size: 20px;
        border-radius: 10px;
        padding-top: 20px;
        padding-bottom: 20px;
        width: 380px;
      }

    </style>
  </head>
  <body>
    <input class="namebox" 
    placeholder="First name">
    <input class="lastname" type="text" 
    placeholder="Lastmame">
    <input class="emailbox" type="text"
    placeholder="Email">
    <button class="signup-button">
      Sign Up
    </button>
  </body>
</html>
