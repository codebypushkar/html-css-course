<!DOCTYPE html>
<html>
  <head>
    <style>
      .tweet {
        border: solid;
        display: inline-block;
        border-color: rgb(240, 240, 240);
        padding-top: 10px;
        padding-bottom: 10px;
        padding-left: 15px;
        padding-right: 15px;
        border-radius: 8px;
        box-shadow: 0px 0px 6px rgba(0, 0, 0, 0.3);
        font-family: Arial;
      }
      .profile-picture{
        width: 50px;
        height: 50px;
        object-fit: cover;
        vertical-align: middle;
        border-radius: 25px; 
        margin-right: 5px;
      }
      .tweet-bar {
        vertical-align: middle;
        width: 300px;
        height: 40px;
        border: none;
        font-size: 18px;
        padding-left: 10px;
        border-radius: 18px;
      }
      .tweet-button {
        background-color: rgb(45, 132, 254);
        color:white;
        font-size: 16px;
        padding-top: 8px;
        padding-bottom: 8px;
        padding-left: 16px;
        padding-right: 16px;
        border: none;
        font-weight: bold;
        border-radius: 18px;
        cursor: pointer;
        vertical-align: middle;
      }
    </style>
    </head>
  <body>
    <div class="tweet">
      <img class="profile-picture"  src="iron-man.jpg">
      <input class="tweet-bar" type="text" 
      placeholder="What's happening? ">
      <button class="tweet-button">
        Tweet
      </button>        
    </div>
  </body>

</html>
