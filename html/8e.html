<!DOCTYPE html>
<html>
  <head>
    <title>uber</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@700&display=swap" rel="stylesheet">
    <style>
      
      .request {
        font-size: 40px;
        font-family: roboto;
        display: block;
        margin-bottom: 25px;
      }
      .pickup,
      .drop {
        width: 400px;
        font-size: 16px;
        padding-top: 12px;
        padding-bottom: 12px;
        padding-left: 15px;
        padding-right: 15px;
        color: rgb(100, 100, 100);
        border: none;
        background-color: rgb(230, 231, 232);
        display: block;
        margin-bottom: 10px;

      }
      .request-button{
        border: none;
        background-color: black;
        color: white;
        padding-top: 15px;
        padding-bottom: 15px;
        padding-left: 25px;
        padding-right: 25px;
        font-size: 16px;
        cursor: pointer;
        margin-top: 20px;
      }
      .schedule {
        margin-left: 20px;
        padding-left: 25px;
        padding-right: 25px;
        padding-top: 15px;
        padding-bottom: 15px;
        font-size: 16px;
        background-color: rgb(230, 231, 232);
        border: none;
        cursor: pointer;
        
      }
    </style>
  </head>
  <body>
    <h class="request">
      Request a ride now
    </h>
    <input class="pickup" 
    placeholder="Enter pickup location" >
    <input class="drop" 
    placeholder="Enter destination" >
    <button class="request-button">
      Request now
    </button>
    <button class="schedule">
      Schedule for later
    </button>
  </body>
</html>
